<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="심플하고 아름다운 Todo 앱. 할 일을 관리하고 생산성을 높이세요.">
  <title>Todo App — 할 일 관리</title>

  <!-- Google Fonts: Inter for modern, clean typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 메인 앱 컨테이너 ===== -->
  <div class="app-container" id="app-container">

    <!-- ===== 헤더 영역: 앱 타이틀 + 통계 ===== -->
    <header class="app-header" id="app-header">
      <div class="header-content">
        <div class="header-icon" aria-hidden="true">✦</div>
        <h1 class="header-title">Todo</h1>
        <p class="header-subtitle">오늘 할 일을 정리하세요</p>
      </div>
      <div class="header-stats" id="header-stats">
        <div class="stat-item">
          <span class="stat-number" id="stat-total">0</span>
          <span class="stat-label">전체</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-number" id="stat-completed">0</span>
          <span class="stat-label">완료</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-number" id="stat-remaining">0</span>
          <span class="stat-label">남은 할 일</span>
        </div>
      </div>
    </header>

    <!-- ===== 날짜 내비게이션 영역 ===== -->
    <div class="date-navigator" id="date-navigator">
      <button class="nav-button" id="prev-date-btn" aria-label="이전 날짜">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10 12L4 8L10 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="date-display-wrapper" id="date-display-wrapper">
        <div class="date-display" id="date-display-trigger" role="button" aria-haspopup="dialog" aria-expanded="false" tabindex="0" aria-label="날짜 선택기 열기">
          <span class="current-date-text" id="current-date-text">2026년 6월 3일 수요일</span>
          <span class="dropdown-arrow" aria-hidden="true">▾</span>
          <button class="today-badge" id="today-btn" tabindex="0">오늘</button>
        </div>

        <!-- 
          ===== 커스텀 달력 팝오버 =====
          - JS를 통해 동적으로 년/월 헤더와 7x6 날짜 그리드가 렌더링될 영역입니다.
          - 기본적으로 hidden 상태이며 활성화 시 CSS를 통해 부드럽게 노출됩니다.
        -->
        <div class="calendar-popover hidden" id="calendar-popover" role="dialog" aria-modal="true" aria-label="달력 날짜 선택기">
          <!-- JS로 동적 생성될 캘린더 헤더, 그리드가 주입되는 곳 -->
        </div>
      </div>
      <button class="nav-button" id="next-date-btn" aria-label="다음 날짜">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M6 4L12 8L6 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- ===== 입력 영역: Todo 추가 폼 ===== -->
    <form class="input-section" id="todo-form" novalidate>
      <div class="input-wrapper" id="input-wrapper">
        <input
          type="text"
          class="todo-input"
          id="todo-input"
          placeholder="새로운 할 일을 입력하세요..."
          autocomplete="off"
          aria-label="새 할 일 입력"
          aria-errormessage="input-error-message"
          required
        >
        <button type="submit" class="add-button" id="add-button" aria-label="할 일 추가">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <!-- 빈 입력 경고 메시지 -->
      <div class="error-message" id="input-error-message" role="alert" aria-live="polite">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.5"/>
          <path d="M7 4V7.5M7 9.5V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>할 일을 입력해주세요</span>
      </div>
    </form>

    <!-- 
      ===== 필터 영역 ===== 
      - id="filter-container": app.js에서 캐싱하여 이벤트 위임 리스너를 매달 단 하나의 부모 컨테이너입니다.
      - data-filter 속성: 자바스크립트가 어떤 필터 버튼이 클릭되었는지 감지하기 위한 식별 이름표 데이터셋입니다.
      - active 클래스: 초기 로드 시 '전체' 탭이 선택되어 있음을 시각적으로 지시합니다.
    -->
    <div class="filter-container" id="filter-container">
      <button class="filter-tab active" data-filter="all">전체</button>
      <button class="filter-tab" data-filter="active">진행 중</button>
      <button class="filter-tab" data-filter="completed">완료</button>
    </div>

    <!-- ===== Todo 리스트 영역 ===== -->
    <main class="todo-list-container" id="todo-list-container">
      <!-- 빈 상태 안내 -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon" aria-hidden="true">📝</div>
        <p class="empty-text">아직 할 일이 없습니다</p>
        <p class="empty-subtext">위에서 새로운 할 일을 추가해보세요!</p>
      </div>

      <!-- Todo 아이템 리스트 (동적 렌더링) -->
      <ul class="todo-list" id="todo-list" role="list" aria-label="할 일 목록"></ul>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
